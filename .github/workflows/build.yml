# 記事(_notes)や文面データ(content.json)が変わったら、_build/build.py でページを作り直して反映する。
# Pages CMS で保存した時もこれが動く。

name: Build pages

on:
  push:
    branches: [main]
    paths:
      - "_notes/**"
      - "content.json"
      - "_build/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install markdown pillow pyyaml

      - name: Build
        run: python3 _build/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "ページを組み立て(自動)"
          git pull --rebase origin main
          git push origin HEAD:main
