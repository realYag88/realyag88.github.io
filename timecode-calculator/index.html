<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TimeCode Calculator | カプラメー</title>
  <meta name="description" content="フレーム数と24fps・30fpsのタイムコードを相互に換算できる電卓。解像度の縦横比計算にも対応。">
  <meta name="theme-color" content="#1b1a1f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #1b1a1f;
      --panel: #232228;
      --line: #3a3741;
      --text: #ede8de;
      --muted: #a8a39a;
      --faint: #6f6a73;
      --accent: #d4a64a;

      --num-bg: #e4dfd5; --num-fg: #232228; --num-ac: #cfc9bd;
      --fn-bg: #8f8a93;  --fn-fg: #1b1a1f;  --fn-ac: #7b7680;
      --op-bg: #4a3a1e;  --op-fg: #f3d58f;  --op-ac: #3b2e17;

      --screen-bg: #121115;
      --ink: #d4a64a;
      --dim: #5c4a26;

      --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
      --gothic: "Zen Kaku Gothic New", sans-serif;
    }
    /* モードごとの表示色 */
    .screen[data-mode="frame"] { --ink: #d4a64a; --dim: #5c4a26; }
    .screen[data-mode="24"]    { --ink: #ec9a7c; --dim: #5e3a2e; }
    .screen[data-mode="30"]    { --ink: #b9a4e6; --dim: #463d5c; }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--gothic);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    .topbar {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      margin-bottom: 8px;
    }
    .topbar a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.06em;
    }
    .topbar a:hover { color: var(--accent); }
    .topbar h1 {
      margin: 0;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    .calc {
      width: 100%;
      max-width: 400px;
      padding: 14px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    /* ---- タブ ---- */
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .tabs button {
      min-height: 40px;
      padding: 0 14px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- 表示部 ---- */
    .view[hidden] { display: none; }
    .screen {
      position: relative;
      height: 96px;
      border-radius: 10px;
      background: var(--screen-bg);
      border: 1px solid #000;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .screen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mode {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-30%);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
    }
    .pending {
      position: absolute;
      right: 12px;
      top: 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
    }
    .cells {
      position: absolute;
      right: 12px;
      bottom: 10px;
      display: flex;
      gap: 10px;
    }
    .cell { display: flex; flex-direction: column; align-items: flex-end; }
    .cell[hidden] { display: none; }
    .digit {
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px color-mix(in srgb, var(--ink) 35%, transparent);
    }
    .tag {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--faint);
    }
    .hint {
      height: 32px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* ---- 解像度 ---- */
    .res {
      height: 96px;
      border-radius: 10px;
      background: var(--screen-bg);
      border: 1px solid #000;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      align-content: center;
      align-items: center;
      gap: 6px 8px;
      padding: 0 12px;
    }
    .res-label { font-size: 12px; color: var(--muted); padding-right: 4px; }
    .res-x { font-size: 12px; color: var(--faint); }
    .field {
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #1d1c22;
      color: var(--text);
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 700;
      text-align: right;
      cursor: pointer;
    }
    .field.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .field.calc { color: var(--accent); }
    .field:focus-visible { outline: none; border-color: var(--accent); }

    /* ---- キー ---- */
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .key {
      height: 56px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.08s;
    }
    .key.num { background: var(--num-bg); color: var(--num-fg); }
    .key.num:active, .key.num.flash { background: var(--num-ac); }
    .key.fn  { background: var(--fn-bg); color: var(--fn-fg); font-size: 15px; font-weight: 700; }
    .key.fn:active, .key.fn.flash { background: var(--fn-ac); }
    .key.op  { background: var(--op-bg); color: var(--op-fg); }
    .key.op:active, .key.op.flash { background: var(--op-ac); }
    .key.op:disabled { color: #7d6a45; cursor: default; }
    .key.wide { grid-column: span 2; }
    .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .note {
      white-space: pre;
      margin: 12px 0 0;
      min-height: 18px;
      font-size: 11px;
      color: var(--faint);
      text-align: center;
      letter-spacing: 0.02em;
    }
    @media (hover: none) { .note { display: none; } }

    @media (min-width: 721px) {
      body { justify-content: center; }
      .key { height: 52px; }
    }
    @media (prefers-reduced-motion: reduce) { .key { transition: none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/tools/timecode-calculator/">← カプラメー</a>
    <h1>TIMECODE CALCULATOR</h1>
  </div>

  <div class="calc">
    <div class="tabs" role="tablist" aria-label="モード">
      <button type="button" role="tab" id="tab-fps" aria-selected="true" aria-controls="view-fps">FPS換算</button>
      <button type="button" role="tab" id="tab-res" aria-selected="false" aria-controls="view-res">解像度</button>
    </div>

    <!-- FPS換算 -->
    <div class="view" id="view-fps" role="tabpanel" aria-labelledby="tab-fps">
      <div class="screen" id="screen" data-mode="frame" tabindex="0" role="button" aria-label="表示部。押すとFRAME・24FPS・30FPSを切り替え">
        <span class="mode" id="mode">FRAME</span>
        <span class="pending" id="pending"></span>
        <div class="cells" id="cells">
          <div class="cell"><span class="digit"></span><span class="tag"></span></div>
          <div class="cell"><span class="digit"></span><span class="tag"></span></div>
          <div class="cell"><span class="digit"></span><span class="tag"></span></div>
          <div class="cell"><span class="digit"></span><span class="tag"></span></div>
        </div>
      </div>
      <p class="hint" id="hint" aria-live="polite">画面タップで FRAME / 24FPS / 30FPS に換算</p>
    </div>

    <!-- 解像度 -->
    <div class="view" id="view-res" role="tabpanel" aria-labelledby="tab-res" hidden>
      <div class="res">
        <span class="res-label">元サイズ</span>
        <button type="button" class="field" data-key="ow" aria-label="元の幅"></button>
        <span class="res-x">×</span>
        <button type="button" class="field" data-key="oh" aria-label="元の高さ"></button>
        <span class="res-label">変換後</span>
        <button type="button" class="field" data-key="nw" aria-label="変換後の幅"></button>
        <span class="res-x">×</span>
        <button type="button" class="field" data-key="nh" aria-label="変換後の高さ"></button>
      </div>
      <p class="hint" id="ratio"></p>
    </div>

    <div class="keys" id="keys">
      <button type="button" class="key fn" data-k="c">C</button>
      <button type="button" class="key fn" data-k="ce">CE</button>
      <button type="button" class="key fn" data-k="bs" aria-label="1文字消す">⌫</button>
      <button type="button" class="key op" data-k="/">÷</button>
      <button type="button" class="key num" data-k="7">7</button>
      <button type="button" class="key num" data-k="8">8</button>
      <button type="button" class="key num" data-k="9">9</button>
      <button type="button" class="key op" data-k="*">×</button>
      <button type="button" class="key num" data-k="4">4</button>
      <button type="button" class="key num" data-k="5">5</button>
      <button type="button" class="key num" data-k="6">6</button>
      <button type="button" class="key op" data-k="-">−</button>
      <button type="button" class="key num" data-k="1">1</button>
      <button type="button" class="key num" data-k="2">2</button>
      <button type="button" class="key num" data-k="3">3</button>
      <button type="button" class="key op" data-k="+">+</button>
      <button type="button" class="key num wide" data-k="0">0</button>
      <button type="button" class="key num wide" data-k="eq">=</button>
    </div>

    <p class="note" id="note"></p>
  </div>

<script>
(function () {
  "use strict";

  // ================= 定数 =================
  var MODES = ["frame", "24", "30"];
  var MODE_LABEL = { frame: "FRAME", "24": "24 FPS", "30": "30 FPS" };
  var FPS = { "24": 24, "30": 30 };
  var RES_ORDER = ["ow", "oh", "nw", "nh"];
  var STORE_KEY = "caprame-timecode-res";
  var touch = window.matchMedia && window.matchMedia("(hover: none)").matches;
  var HINT_TEXT = (touch ? "画面タップ" : "画面クリック") + "で FRAME / 24FPS / 30FPS に換算";
  var NOTE_FPS = "Enter＝  Esc＝C  Del＝CE  Tab＝モード切替  Alt+2＝解像度";
  var NOTE_RES = "Tab・Enter＝次の欄  Esc＝C  Del＝CE  Alt+1＝FPS換算";

  // ================= 状態 =================
  var tab = "fps";
  var mode = "frame";
  var value = 0;        // 常に総フレーム数
  var entry = null;     // 入力中の数字列 (null=入力中でない)
  var stored = null;    // 演算待ちの左辺
  var op = null;        // 保留中の演算子
  var justEq = false;
  var hintTimer = null;

  var res = { ow: "1920", oh: "1080", nw: "", nh: "" };
  var resActive = "nw";
  var resFresh = true;  // 欄を選んだ直後は、次の数字で上書き
  var resDriver = "nw"; // 変換後の幅/高さのうち、入力した側
  loadSettings();

  // ================= 要素 =================
  var $ = function (id) { return document.getElementById(id); };
  var screen = $("screen"), modeEl = $("mode"), pendEl = $("pending"), hintEl = $("hint");
  var cells = Array.prototype.map.call($("cells").children, function (c) {
    return { el: c, d: c.querySelector(".digit"), t: c.querySelector(".tag") };
  });
  var fields = {};
  document.querySelectorAll(".field").forEach(function (f) { fields[f.dataset.key] = f; });
  var opKeys = document.querySelectorAll(".key.op");

  // ================= 保存 =================
  function loadSettings() {
    try {
      var d = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      ["ow", "oh"].forEach(function (k) {
        var v = String(d[k] == null ? "" : d[k]);
        if (/^\d{1,5}$/.test(v)) res[k] = v;
      });
    } catch (e) {}
  }
  function saveSettings() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ ow: res.ow, oh: res.oh })); } catch (e) {}
  }

  // ================= タブ =================
  function setTab(t) {
    tab = t;
    $("tab-fps").setAttribute("aria-selected", String(t === "fps"));
    $("tab-res").setAttribute("aria-selected", String(t === "res"));
    $("view-fps").hidden = t !== "fps";
    $("view-res").hidden = t !== "res";
    $("note").textContent = t === "fps" ? NOTE_FPS : NOTE_RES;
    opKeys.forEach(function (b) { b.disabled = t !== "fps"; });
  }

  // ================= FPS換算 =================
  function fps(m) { return FPS[m || mode] || 30; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function parseEntry(s, m) {
    if (m === "frame") return parseInt(s || "0", 10);
    s = ("00000000" + (s || "0")).slice(-8);
    var h = +s.slice(0, 2), mi = +s.slice(2, 4), se = +s.slice(4, 6), f = +s.slice(6, 8);
    return (h * 3600 + mi * 60 + se) * fps(m) + f;
  }
  function commitEntry() {
    if (entry !== null) { value = parseEntry(entry, mode); entry = null; }
  }
  function tcParts(v, m) {
    var r = fps(m), neg = v < 0, a = Math.abs(v);
    var f = a % r, ts = Math.floor(a / r);
    var se = ts % 60; ts = Math.floor(ts / 60);
    var mi = ts % 60, h = Math.floor(ts / 60);
    return { neg: neg, v: [pad2(h), pad2(mi), pad2(se), pad2(f)] };
  }
  function formatShort(v) {
    if (mode === "frame") return String(v);
    var p = tcParts(v, mode);
    return (p.neg ? "-" : "") + p.v.join(".");
  }

  function render() {
    screen.dataset.mode = mode;
    modeEl.textContent = MODE_LABEL[mode];

    if (mode === "frame") {
      var text = entry !== null ? (entry || "0") : String(value);
      cells.forEach(function (c, i) {
        c.el.hidden = i !== 3;
        c.d.textContent = i === 3 ? text : "";
        c.t.textContent = i === 3 ? "FRAME" : "";
      });
    } else {
      var vals, neg = false;
      if (entry !== null) {
        var s = ("00000000" + (entry || "0")).slice(-8);
        vals = [s.slice(0, 2), s.slice(2, 4), s.slice(4, 6), s.slice(6, 8)];
      } else {
        var p = tcParts(value, mode);
        vals = p.v; neg = p.neg;
      }
      var tags = ["HOR", "MIN", "SEC", "FRM"];
      cells.forEach(function (c, i) {
        c.el.hidden = false;
        c.d.textContent = (i === 0 && neg ? "-" : "") + vals[i];
        c.t.textContent = tags[i];
      });
    }

    if (op !== null && stored !== null) {
      var sym = { "+": "+", "-": "−", "*": "×", "/": "÷" }[op];
      pendEl.textContent = formatShort(stored) + " " + sym;
    } else {
      pendEl.textContent = "";
    }
  }

  function flashHint(msg) {
    hintEl.textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { hintEl.textContent = HINT_TEXT; }, 1600);
  }

  function compute(a, b, o) {
    if (o === "+") return a + b;
    if (o === "-") return a - b;
    if (o === "*") return a * b;
    if (o === "/") {
      if (b === 0) { flashHint("0では割れません"); return a; }
      return pyRound(a / b);
    }
    return b;
  }
  // Python版と同じ丸め(0.5は偶数側へ)
  function pyRound(x) {
    var f = Math.floor(x), d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }

  function inputDigit(d) {
    if (justEq) { entry = null; stored = null; op = null; justEq = false; }
    if (entry === null) entry = "";
    var limit = mode === "frame" ? 10 : 8;
    if (entry.length >= limit) return;
    entry += d;
    render();
  }
  function pressOp(o) {
    commitEntry();
    justEq = false;
    if (op !== null && stored !== null) value = compute(stored, value, op);
    stored = value;
    op = o;
    entry = null;
    render();
  }
  function pressEq() {
    commitEntry();
    if (op !== null && stored !== null) {
      value = compute(stored, value, op);
      stored = null; op = null; justEq = true;
    }
    render();
  }
  function clearAll() { value = 0; entry = null; stored = null; op = null; justEq = false; render(); }
  function clearEntry() {
    entry = null;
    if (justEq) { value = 0; justEq = false; }
    render();
  }
  function backspace() {
    if (entry) entry = entry.slice(0, -1);
    render();
  }
  function cycleMode() {
    commitEntry();
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    justEq = false;
    render();
  }

  // ================= 解像度 =================
  function toInt(s) { return /^\d+$/.test(s || "") ? parseInt(s, 10) : 0; }
  function ceilDiv(a, b) { return Math.floor((a + b - 1) / b); } // 正の整数どうしの切り上げ
  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }

  function resRecalc() {
    var ow = toInt(res.ow), oh = toInt(res.oh);
    if (resDriver === "nw") {
      var nw = toInt(res.nw);
      res.nh = ow && oh && nw ? String(ceilDiv(nw * oh, ow)) : "";
    } else {
      var nh = toInt(res.nh);
      res.nw = ow && oh && nh ? String(ceilDiv(nh * ow, oh)) : "";
    }
  }
  function renderRes() {
    var calcKey = resDriver === "nw" ? "nh" : "nw";
    RES_ORDER.forEach(function (k) {
      var f = fields[k];
      f.textContent = res[k];
      f.classList.toggle("active", k === resActive && tab === "res");
      f.classList.toggle("calc", k === calcKey);
    });
    var ow = toInt(res.ow), oh = toInt(res.oh), el = $("ratio");
    if (ow && oh) {
      var g = gcd(ow, oh), a = ow / g, b = oh / g;
      var ratio = a <= 64 && b <= 64 ? a + ":" + b + "  /  " : "";
      el.textContent = "比率 " + ratio + (ow / oh).toFixed(3) + ":1   ※端数は切り上げ";
    } else {
      el.textContent = "元サイズを入力してください";
    }
  }
  function resAfterEdit() {
    var k = resActive;
    if (k === "nw" || k === "nh") resDriver = k;
    resRecalc();
    if (k === "ow" || k === "oh") saveSettings();
    renderRes();
  }
  function resDigit(d) {
    var k = resActive;
    if (resFresh) { res[k] = ""; resFresh = false; }
    if (res[k].length >= 5) return;
    if (res[k] === "0") res[k] = "";
    res[k] += d;
    resAfterEdit();
  }
  function resBackspace() { res[resActive] = res[resActive].slice(0, -1); resFresh = false; resAfterEdit(); }
  function resClearEntry() { res[resActive] = ""; resFresh = false; resAfterEdit(); }
  function resClearAll() {
    RES_ORDER.forEach(function (k) { res[k] = ""; });
    resActive = "ow"; resDriver = "nw"; resFresh = true;
    saveSettings();
    renderRes();
  }
  function resSelect(k) { resActive = k; resFresh = true; renderRes(); }
  function resMove(step) {
    var i = RES_ORDER.indexOf(resActive);
    resSelect(RES_ORDER[(i + step + RES_ORDER.length) % RES_ORDER.length]);
  }

  // ================= 入力 =================
  function onKey(code) {
    if (tab === "res") {
      if (/^\d$/.test(code)) resDigit(code);
      else if (code === "eq") resMove(1);
      else if (code === "c") resClearAll();
      else if (code === "ce") resClearEntry();
      else if (code === "bs") resBackspace();
      return; // 四則演算は解像度タブでは使わない
    }
    if (/^\d$/.test(code)) inputDigit(code);
    else if ("+-*/".indexOf(code) >= 0) pressOp(code);
    else if (code === "eq") pressEq();
    else if (code === "c") clearAll();
    else if (code === "ce") clearEntry();
    else if (code === "bs") backspace();
  }

  function flashKey(code) {
    var b = document.querySelector('.key[data-k="' + code + '"]');
    if (!b || b.disabled) return;
    b.classList.add("flash");
    setTimeout(function () { b.classList.remove("flash"); }, 90);
  }

  $("keys").addEventListener("click", function (e) {
    var b = e.target.closest(".key");
    if (b && !b.disabled) onKey(b.dataset.k);
  });
  screen.addEventListener("click", function () { cycleMode(); screen.blur(); });
  $("tab-fps").addEventListener("click", function () { setTab("fps"); renderRes(); });
  $("tab-res").addEventListener("click", function () { setTab("res"); renderRes(); });
  Object.keys(fields).forEach(function (k) {
    fields[k].addEventListener("click", function () { resSelect(k); });
  });

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey) return; // ブラウザのショートカットは邪魔しない
    var k = e.key;

    if (e.altKey) {
      if (e.code === "Digit1" || e.code === "Numpad1") { setTab("fps"); renderRes(); e.preventDefault(); }
      else if (e.code === "Digit2" || e.code === "Numpad2") { setTab("res"); renderRes(); e.preventDefault(); }
      return;
    }

    var code = null;
    if (/^\d$/.test(k)) code = k;
    else if ("+-*/".indexOf(k) >= 0) code = k;
    else if (k === "Enter" || k === "=") code = "eq";
    else if (k === "Escape") code = "c";
    else if (k === "Delete") code = "ce";
    else if (k === "Backspace") code = "bs";

    if (k === "Tab") {
      e.preventDefault();
      if (tab === "res") resMove(e.shiftKey ? -1 : 1);
      else cycleMode();
      return;
    }
    if (tab === "res" && (k === "ArrowUp" || k === "ArrowDown")) {
      e.preventDefault();
      resMove(k === "ArrowUp" ? -1 : 1);
      return;
    }
    if (code === null) return;
    // Enterでボタンやタブが押されないように、計算機のキーとして扱う
    e.preventDefault();
    onKey(code);
    flashKey(code);
  });

  hintEl.textContent = HINT_TEXT;
  setTab("fps");
  render();
  renderRes();
})();
</script>
</body>
</html>
